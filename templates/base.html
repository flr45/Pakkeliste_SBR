<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a8070d">
  <title>{% block title %}SBR Operativ Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="SBR Operativ Portal">
    <span class="brand-mark">SBR</span>
    <span><strong>Operativ Portal</strong><small>Slagelse Brand og Redning</small></span>
  </a>
  <nav class="desktop-nav" aria-label="Hovedmenu">
    <a href="/">Forside</a>
    <a href="/#koeretoejer">Køretøjer</a>
    <a href="/#videoakademi">Videoakademi</a>
    <a href="/#videnbank">Videnbank</a>
    {% if logged %}<a href="/upload">Administration</a><a href="/logout">Log ud</a>{% else %}<a href="/login">Log ind</a>{% endif %}
  </nav>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<nav class="mobile-nav" aria-label="Mobilmenu">
  <a href="/" class="active"><span>⌂</span>Forside</a>
  <a href="/#koeretoejer"><span>🚒</span>Køretøjer</a>
  <a href="/#soeg"><span>⌕</span>Søg</a>
  <a href="/#favoritter"><span>☆</span>Favoritter</a>
  {% if logged %}<a href="/upload"><span>⚙</span>Admin</a>{% else %}<a href="/login"><span>♙</span>Profil</a>{% endif %}
</nav>
</body>
</html>

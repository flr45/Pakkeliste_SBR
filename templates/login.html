{% extends "base.html" %}
{% block title %}Log ind · SBR Operativ Portal{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <p class="kicker">Administration</p>
    <h1>Log ind</h1>
    <p class="lead">Adgang til redigering af køretøjer, rum, udstyr og dokumenter.</p>
  </div>
</header>

{% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
<form method="post" class="card">
  <label>Brugernavn<input name="username" autocomplete="username" required></label>
  <label>Adgangskode<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log ind</button>
</form>
{% endblock %}
